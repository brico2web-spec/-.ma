<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بدل.ma - المنصة المغربية الحقيقية للمقايضة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Init Supabase -->
    <script>
        const SUPABASE_URL = 'https://ppcquipmddofccpxyntj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwY3F1aXBtZGRvZmNjcHh5bnRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMjE5MTMsImV4cCI6MjEwNzU5NzkxM30.VZUILKGWpumj9GoNOH89jCgh4PpdNbeHfgbAxogivkY';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-black shadow-md">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </div>
                <span class="text-2xl font-black text-slate-900">بدل<span class="text-emerald-600">.ma</span></span>
            </div>
            <div id="authHeaderSection">
                <!-- Injected via JS -->
            </div>
        </div>
    </header>

    <!-- Main Section -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-gradient-to-r from-emerald-950 to-slate-900 p-6 rounded-3xl text-white shadow-xl">
            <div>
                <span class="bg-emerald-500/20 text-emerald-400 text-xs font-bold px-3 py-1 rounded-full border border-emerald-500/30 inline-block mb-2">🇲🇦 منصة المقايضة المغربية الرسمية</span>
                <h1 class="text-2xl font-black">بدل داكشي اللي ما محتاجوش</h1>
                <p class="text-xs text-slate-300 mt-1">مقايضة مباشرة بـ 0 درهم والتواصل عبر الواتساب</p>
            </div>
            <button onclick="handleOpenAddModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-5 py-3 rounded-2xl shadow-lg transition flex items-center gap-2 whitespace-nowrap cursor-pointer">
                <i class="fa-solid fa-plus-circle text-base"></i> أضف عرضك الجديد
            </button>
        </div>

        <!-- Listings Grid -->
        <div id="listingsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="col-span-full text-center py-12 text-slate-400 font-bold">جاري تحميل العروض الحقيقية...</p>
        </div>
    </main>

    <!-- Modal: Authentic Auth (Login / Register Tabs) -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl relative">
            <button onclick="closeModal('authModal')" class="absolute top-4 left-4 text-slate-400 font-bold">&times;</button>
            
            <!-- Auth Tab Buttons -->
            <div class="flex border-b border-slate-200">
                <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="w-1/2 py-2 text-sm font-bold text-emerald-600 border-b-2 border-emerald-600">تسجيل الدخول</button>
                <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="w-1/2 py-2 text-sm font-bold text-slate-400">حساب جديد</button>
            </div>

            <!-- Form 1: LOGIN -->
            <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-3 text-xs text-right">
                <div>
                    <label class="font-bold text-slate-700 block mb-1">رقم الواتساب *</label>
                    <input type="tel" id="loginPhone" required placeholder="0600000000" class="w-full bg-slate-50 border p-3 rounded-xl font-bold">
                </div>
                <div>
                    <label class="font-bold text-slate-700 block mb-1">كلمة السر *</label>
                    <input type="password" id="loginPass" required placeholder="******" class="w-full bg-slate-50 border p-3 rounded-xl font-bold">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow transition mt-2">تسجيل الدخول 🔑</button>
            </form>

            <!-- Form 2: REGISTER -->
            <form id="registerForm" onsubmit="handleRegisterSubmit(event)" class="space-y-3 text-xs text-right hidden">
                <div>
                    <label class="font-bold text-slate-700 block mb-1">الاسم الكامل *</label>
                    <input type="text" id="regName" required placeholder="نزار زمزام" class="w-full bg-slate-50 border p-3 rounded-xl font-bold">
                </div>
                <div>
                    <label class="font-bold text-slate-700 block mb-1">رقم الواتساب *</label>
                    <input type="tel" id="regPhone" required placeholder="0600000000" class="w-full bg-slate-50 border p-3 rounded-xl font-bold">
                </div>
                <div>
                    <label class="font-bold text-slate-700 block mb-1">المدينة *</label>
                    <select id="regCity" class="w-full bg-slate-50 border p-3 rounded-xl font-bold">
                        <option value="القنيطرة">القنيطرة</option>
                        <option value="الرباط">الرباط</option>
                        <option value="الدار البيضاء">الدار البيضاء</option>
                        <option value="فاس">فاس</option>
                        <option value="طنجة">طنجة</option>
                        <option value="سلا">سلا</option>
                    </select>
                </div>
                <div>
                    <label class="font-bold text-slate-700 block mb-1">كلمة السر *</label>
                    <input type="password" id="regPass" required placeholder="أدخل كلمة سر الحساب" class="w-full bg-slate-50 border p-3 rounded-xl font-bold">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow transition mt-2">إنشاء حساب جديد 🚀</button>
            </form>
        </div>
    </div>

    <!-- Modal: Add Item -->
    <div id="addModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl relative">
            <button onclick="closeModal('addModal')" class="absolute top-4 left-4 text-slate-400 font-bold">&times;</button>
            <h3 class="font-black text-lg text-slate-900">نشر عرض مقايضة جديد</h3>
            <form onsubmit="handleAddItem(event)" class="space-y-3 text-xs text-right">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">عنوان العرض *</label>
                    <input type="text" id="addTitle" required placeholder="مثلاً: هاتف نقي أو طاولة خشبية" class="w-full bg-slate-50 border p-3 rounded-xl font-bold">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">الفئة *</label>
                        <select id="addCategory" class="w-full bg-slate-50 border p-3 rounded-xl font-bold">
                            <option value="إلكترونيات">إلكترونيات</option>
                            <option value="وسائل نقل">دراجات وسيارات</option>
                            <option value="أثاث">أثاث ومنزل</option>
                            <option value="خدمات">حرفيين وخدمات</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">نوع التبادل *</label>
                        <select id="addTradeType" class="w-full bg-slate-50 border p-3 rounded-xl font-bold">
                            <option value="راس فـ راس">راس فـ راس</option>
                            <option value="نزيدك الفلوس">نزيدك الفلوس</option>
                            <option value="تزيدني الفلوس">تزيدني الفلوس</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">شنو باغي بدالها؟ *</label>
                    <input type="text" id="addWanted" required placeholder="مثلاً: باغي بيسيكليت VTT ولا تلفزة" class="w-full bg-slate-50 border p-3 rounded-xl font-bold">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">صورة المنتج *</label>
                    <input type="file" id="addImageFile" accept="image/*" required class="w-full bg-slate-50 border p-2 rounded-xl text-xs">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">وصف قصير</label>
                    <textarea id="addDesc" rows="2" placeholder="حالة المنتج..." class="w-full bg-slate-50 border p-3 rounded-xl font-bold"></textarea>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow transition">نشر العرض في المنصة 🚀</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800 mt-12">
        <p>جميع الحقوق محفوظة © 2026 - بدل.ma | النسخة 1</p>
    </footer>

    <!-- Application JavaScript Logic -->
    <script>
        let currentAccount = null;

        window.onload = function() {
            const savedAcc = localStorage.getItem('badal_auth_account');
            if(savedAcc) {
                currentAccount = JSON.parse(savedAcc);
            }
            updateHeaderUI();
            fetchListings();
        };

        function updateHeaderUI() {
            const container = document.getElementById('authHeaderSection');
            if(currentAccount) {
                container.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-emerald-800 bg-emerald-50 px-3 py-2 rounded-xl border border-emerald-200">
                            <i class="fa-solid fa-user-check text-emerald-600 ml-1"></i> ${currentAccount.full_name} (${currentAccount.city})
                        </span>
                        <button onclick="handleLogout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold px-3 py-2 rounded-xl transition cursor-pointer">تسجيل الخروج</button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="openModal('authModal')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-4 py-2.5 rounded-xl transition cursor-pointer">
                        <i class="fa-solid fa-right-to-bracket ml-1"></i> دخول / حساب جديد
                    </button>
                `;
            }
        }

        function switchAuthTab(mode) {
            const loginForm = document.getElementById('loginForm');
            const regForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLoginBtn');
            const tabReg = document.getElementById('tabRegisterBtn');

            if(mode === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.className = "w-1/2 py-2 text-sm font-bold text-emerald-600 border-b-2 border-emerald-600";
                tabReg.className = "w-1/2 py-2 text-sm font-bold text-slate-400";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                tabReg.className = "w-1/2 py-2 text-sm font-bold text-emerald-600 border-b-2 border-emerald-600";
                tabLogin.className = "w-1/2 py-2 text-sm font-bold text-slate-400";
            }
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const full_name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const city = document.getElementById('regCity').value;
            const password = document.getElementById('regPass').value;

            const { data: existing } = await _supabase.from('profiles').select('*').eq('phone', phone);
            if(existing && existing.length > 0) {
                alert("هذا الرقم مسجل به حساب سابقاً! يمكنك تسجيل الدخول به مباشرة.");
                switchAuthTab('login');
                return;
            }

            const { data, error } = await _supabase.from('profiles').insert([{ full_name, phone, city, password }]).select();

            if(error) {
                alert("خطأ في إنشاء الحساب: " + error.message);
                return;
            }

            currentAccount = data[0];
            localStorage.setItem('badal_auth_account', JSON.stringify(currentAccount));
            updateHeaderUI();
            closeModal('authModal');
            alert(`مرحباً بك يا ${full_name}! تم إنشاء حسابك بنجاح وحفظه.`);
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPass').value;

            const { data, error } = await _supabase.from('profiles').select('*').eq('phone', phone).eq('password', password);

            if(error || !data || data.length === 0) {
                alert("رقم الهاتف أو كلمة السر غير صحيحة!");
                return;
            }

            currentAccount = data[0];
            localStorage.setItem('badal_auth_account', JSON.stringify(currentAccount));
            updateHeaderUI();
            closeModal('authModal');
            alert(`أهلاً بك مجدداً يا ${currentAccount.full_name}!`);
        }

        function handleLogout() {
            localStorage.removeItem('badal_auth_account');
            currentAccount = null;
            updateHeaderUI();
            fetchListings();
        }

        function handleOpenAddModal() {
            if(!currentAccount) {
                alert("المرجو تسجيل الدخول أو إنشاء حساب جديد أولاً لإضافة عرضك!");
                openModal('authModal');
                return;
            }
            openModal('addModal');
        }

        async function fetchListings() {
            const grid = document.getElementById('listingsGrid');
            const { data, error } = await _supabase.from('listings').select('*').order('created_at', { ascending: false });

            if(error) {
                grid.innerHTML = `<p class="col-span-full text-center text-rose-500 text-xs">خطأ في جلب البيانات: ${error.message}</p>`;
                return;
            }

            if(!data || data.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-12 font-bold">ما كاين حتا عرض دابا. كن أول واحد يحط عرض!</p>`;
                return;
            }

            grid.innerHTML = data.map(item => {
                const waText = encodeURIComponent(`السلام عليكم، شفت عرضك (${item.title}) فـ بدل.ma وبغيت نتفاوض فـ المقايضة.`);
                const waUrl = `https://wa.me/212${item.phone.replace(/^0+/, '')}?text=${waText}`;

                return `
                <div class="bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition flex flex-col justify-between group">
                    <div>
                        <div class="relative h-48 bg-slate-100 overflow-hidden">
                            <img src="${item.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <span class="absolute top-3 right-3 bg-slate-900/80 backdrop-blur text-white text-[10px] font-bold px-3 py-1 rounded-full">
                                ${item.trade_type}
                            </span>
                            <span class="absolute bottom-3 left-3 bg-emerald-600 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-md">
                                <i class="fa-solid fa-location-dot"></i> ${item.city}
                            </span>
                        </div>
                        <div class="p-4 space-y-2">
                            <h3 class="font-black text-slate-900 text-sm line-clamp-1">${item.title}</h3>
                            <div class="bg-emerald-50 p-2.5 rounded-xl text-xs border border-emerald-100">
                                <span class="font-bold text-emerald-800 block">باغي مقابلها:</span>
                                <p class="text-slate-700 font-semibold line-clamp-2">${item.wanted}</p>
                            </div>
                            <p class="text-xs text-slate-500 line-clamp-2">${item.description || ''}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0 grid grid-cols-2 gap-2 border-t border-slate-50 mt-2">
                        <a href="${waUrl}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 rounded-xl text-center flex items-center justify-center gap-1.5 shadow transition">
                            <i class="fa-brands fa-whatsapp text-sm"></i> واتساب
                        </a>
                        ${currentAccount && currentAccount.id === item.user_id ? `
                            <button onclick="deleteListing('${item.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs py-2.5 rounded-xl text-center transition cursor-pointer">
                                <i class="fa-solid fa-trash"></i> حذف
                            </button>
                        ` : `
                            <a href="${waUrl}" target="_blank" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs py-2.5 rounded-xl text-center flex items-center justify-center gap-1 transition">
                                <i class="fa-solid fa-arrows-rotate"></i> مقايضة
                            </a>
                        `}
                    </div>
                </div>
                `;
            }).join('');
        }

        async function handleAddItem(e) {
            e.preventDefault();
            if(!currentAccount) {
                alert("المرجو تسجيل الدخول أولاً!");
                openModal('authModal');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerText = "جاري رفع الصورة والنشر...";
            btn.disabled = true;

            const file = document.getElementById('addImageFile').files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}.${fileExt}`;

            const { error: imgErr } = await _supabase.storage.from('product-images').upload(fileName, file);

            if(imgErr) {
                alert("خطأ في رفع الصورة: " + imgErr.message);
                btn.innerText = "نشر العرض في المنصة 🚀";
                btn.disabled = false;
                return;
            }

            const imageUrl = `${SUPABASE_URL}/storage/v1/object/public/product-images/${fileName}`;

            const { error: insertErr } = await _supabase.from('listings').insert([{
                title: document.getElementById('addTitle').value,
                category: document.getElementById('addCategory').value,
                city: currentAccount.city,
                trade_type: document.getElementById('addTradeType').value,
                wanted: document.getElementById('addWanted').value,
                phone: currentAccount.phone,
                description: document.getElementById('addDesc').value,
                image_url: imageUrl,
                user_id: currentAccount.id
            }]);

            btn.innerText = "نشر العرض في المنصة 🚀";
            btn.disabled = false;

            if(insertErr) {
                alert("خطأ في حفظ العرض: " + insertErr.message);
            } else {
                closeModal('addModal');
                document.getElementById('addModal').querySelector('form').reset();
                fetchListings();
                alert("تم نشر عرضك بنجاح على بدل.ma! 🎉");
            }
        }

        async function deleteListing(id) {
            if(confirm("واش متأكد بغيتي تمسح هاد العرض؟")) {
                await _supabase.from('listings').delete().eq('id', id);
                fetchListings();
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
